name: Deploy landing

# Builds the Astro landing and deploys it to lorekit.net over FTPS.
# Runs on push to main when the landing changes, or manually.
on:
  push:
    branches: [main]
    paths:
      - 'website/landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so `git describe --tags` resolves the version badge

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/landing/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website/landing

      - name: Build
        run: npm run build
        working-directory: website/landing

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./website/landing/dist/
          server-dir: ${{ vars.FTP_SERVER_DIR_LANDING }}
          exclude: |
            **/.well-known/**
            cgi-bin/**
