name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        # severity=warning: info/style notes (e.g. SC2086 on intentional unquoted
        # word-splitting, SC2015 on test pass||fail idioms) are advisory, not failures.
        # -x follows `. lib/common.sh`, so the shared prologue is checked in the context
        # of each hook that sources it — without it every hook reports SC1090 and the
        # library's own callers are never type-checked against it.
        run: shellcheck -x -S warning -s sh plugins/lore/hooks/*.sh plugins/lore/hooks/lib/*.sh plugins/lore/scripts/*.sh tests/*.sh

  validate:
    name: manifests & hook wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          fail=0
          # Prune node_modules and the website (its Docusaurus tsconfig.json is JSONC
          # with comments — validated by the site's own build, not this plugin CI).
          for f in $(find . \( -path ./node_modules -o -path ./website \) -prune -o -name '*.json' -print); do
            jq empty "$f" || { echo "invalid JSON: $f"; fail=1; }
          done
          exit $fail
      - name: plugin.json has required fields
        run: |
          jq -e '.name and .version and .license' plugins/lore/.claude-plugin/plugin.json >/dev/null
      - name: hook scripts referenced by hooks.json exist and are executable
        # DERIVED from the manifest, never listed here. A hardcoded list stops covering
        # new hooks the moment one is added, and git tracks the exec bit — so a single
        # chmod-less commit shipped a dead hook with CI green. The second loop catches
        # any shipped script, wired or not, for the same reason.
        run: |
          fail=0
          jq -r '.hooks | to_entries[] | .value[] | .hooks[] | .command' \
            plugins/lore/hooks/hooks.json |
            sed 's#^\${CLAUDE_PLUGIN_ROOT}/#plugins/lore/#' | sort -u |
            while read -r p; do
              test -f "$p" || { echo "hooks.json references a missing file: $p"; exit 1; }
              test -x "$p" || { echo "hooks.json references a non-executable file: $p"; exit 1; }
            done || fail=1
          for p in plugins/lore/hooks/*.sh plugins/lore/scripts/*.sh; do
            test -x "$p" || { echo "not executable: $p"; fail=1; }
          done
          # The shared prologue is sourced by every hook, so it must ship — and must NOT
          # be executable, which is why it lives outside the glob above.
          test -f plugins/lore/hooks/lib/common.sh ||
            { echo "missing plugins/lore/hooks/lib/common.sh"; fail=1; }
          test -x plugins/lore/hooks/lib/common.sh &&
            { echo "lib/common.sh must not be executable (it is sourced)"; fail=1; }
          exit $fail
      - name: plugin manifest and layout
        # Replaces a `claude plugin validate` step that sat behind `if command -v claude`
        # and therefore never ran on a runner — dead coverage that read as coverage.
        # These assertions are the parts of that check we can make without the CLI.
        run: |
          fail=0
          jq -e '.name and .version and .description and .license' \
            plugins/lore/.claude-plugin/plugin.json >/dev/null ||
            { echo "plugin.json is missing a required field"; fail=1; }
          case "$(jq -r .version plugins/lore/.claude-plugin/plugin.json)" in
            [0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "plugin.json version is not semver"; fail=1 ;;
          esac
          for d in commands skills agents hooks scripts templates; do
            test -d "plugins/lore/$d" || { echo "missing plugin dir: $d"; fail=1; }
          done
          jq -e '.plugins[] | select(.name == "lore") | .source' \
            .claude-plugin/marketplace.json >/dev/null ||
            { echo "marketplace.json does not list the lore plugin"; fail=1; }
          test -d "$(jq -r '.plugins[] | select(.name=="lore") | .source' .claude-plugin/marketplace.json)" ||
            { echo "marketplace.json points at a missing plugin source"; fail=1; }
          exit $fail
      - name: version strings agree
        # SITE.version and the README badge are bumped by hand at release time; nothing
        # ever checked they matched the plugin, so a release could ship three versions.
        run: |
          fail=0
          v=$(jq -r .version plugins/lore/.claude-plugin/plugin.json)
          grep -q "badge/version-${v}-" README.md ||
            { echo "README version badge does not match plugin.json ($v)"; fail=1; }
          exit $fail

  hook-tests:
    name: hook & script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the test harness
        run: sh tests/run-tests.sh

  scaffold-smoke:
    name: scaffold + docusaurus build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scaffold a project and build it
        run: sh tests/smoke-build.sh "${RUNNER_TEMP}/smoke-proj"
